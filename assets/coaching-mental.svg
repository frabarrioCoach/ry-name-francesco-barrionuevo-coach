<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0E1119"/>
      <stop offset="1" stop-color="#141A25"/>
    </linearGradient>
    <linearGradient id="acc" x1="260" y1="140" x2="980" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0B84E" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F1D07A" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="soft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 260) rotate(90) scale(320 520)">
      <stop stop-color="#7AA2FF" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#1F8A7A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="44" fill="url(#bg)"/>

  <!-- Calm glow -->
  <g filter="url(#blur)" opacity="0.9">
    <path d="M928 168C928 320 790 440 616 440C442 440 304 320 304 168C304 16 442 -44 616 -44C790 -44 928 16 928 168Z" fill="url(#soft)"/>
  </g>

  <!-- Head outline -->
  <path d="M760 608C760 662 724 698 658 698H518C446 698 410 662 410 592V546C368 526 346 482 346 430V378C346 252 442 162 576 162C716 162 806 252 806 378V398C806 442 790 482 760 506V608Z"
        stroke="rgba(255,255,255,0.20)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner lines: "thoughts" -->
  <g opacity="0.9" stroke="rgba(255,255,255,0.14)" stroke-width="2.6" stroke-linecap="round">
    <path d="M454 328C510 292 580 292 636 328"/>
    <path d="M440 386C508 350 598 350 666 386"/>
    <path d="M458 444C520 416 586 416 648 444"/>
  </g>

  <!-- Focus point + orbit -->
  <circle cx="604" cy="354" r="10" fill="url(#acc)" opacity="0.95"/>
  <circle cx="604" cy="354" r="72" stroke="url(#acc)" stroke-width="3" opacity="0.55"/>
  <circle cx="604" cy="354" r="132" stroke="rgba(255,255,255,0.12)" stroke-width="2" opacity="0.6"/>

  <!-- Questions "chips" -->
  <g opacity="0.95">
    <rect x="140" y="510" width="220" height="56" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
    <text x="250" y="546" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="18">
      E se sbaglio?
    </text>

    <rect x="190" y="590" width="270" height="56" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
    <text x="325" y="626" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="18">
      Ho paura del giudizio.
    </text>

    <rect x="820" y="520" width="240" height="56" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
    <text x="940" y="556" text-anchor="middle" fill="rgba(255,255,255,0.78)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="18">
      Non valgo.
    </text>
  </g>

  <text x="120" y="740" fill="rgba(255,255,255,0.62)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="26">
    Coaching (mente e consapevolezza)
  </text>
</svg>
